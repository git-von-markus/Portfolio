<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markus – Portfolio</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- 3D: model-viewer (Web Component) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="name">Markus</div>
        <div class="tagline">Videoproduktion, 3D, Software, Audio</div>
      </div>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Projekte suchen…" />
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Portfolio</h1>
      <p>Scroll nach unten. Jeder Bereich hat ein eigenes Karussell. Pfeile klicken, Projekte durchgehen.</p>
      <div class="chips" id="categoryChips"></div>
    </section>

    <section class="sections" id="sections" aria-live="polite"></section>
  </main>

  <footer class="siteFooter" id="kontakt">
  <div class="footerBar">
    <div class="wrap footerBarInner footerRow">

      <div class="footerButtons">
        <a class="btn footerBtn" href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a>
        <a class="btn footerBtn" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
        <a class="btn footerBtn" href="mailto:you@example.com">Email</a>
      </div>

      <div class="footerLegal">
        <button class="footerLegalCard" type="button" data-legal="datenschutz">Datenschutz</button>
        <button class="footerLegalCard" type="button" data-legal="impressum">Impressum</button>
      </div>

    </div>
  </div>
</footer>


  <template id="legal-impressum">
    <h4>Angaben gemäß § 5 TMG</h4>
    <p>Hier deinen Impressum-Text einfügen.</p>
  </template>

  <template id="legal-datenschutz">
    <h4>Datenschutzerklärung</h4>
    <p>Hier deinen Datenschutz-Text einfügen.</p>
  </template>

</body>
</html>
