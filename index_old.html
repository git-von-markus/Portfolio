<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markus – Portfolio</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- 3D: model-viewer (Web Component) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="name">Markus</div>
        <div class="tagline">Videoproduktion, 3D, Software, Audio</div>
      </div>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Projekte suchen…" />
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Portfolio</h1>
      <p>Scroll nach unten. Jeder Bereich hat ein eigenes Karussell. Pfeile klicken, Projekte durchgehen.</p>
      <div class="chips" id="categoryChips"></div>
    </section>

    <section class="sections" id="sections" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Markus</span>
    <span class="dot">•</span>
    <a href="mailto:you@example.com">you@example.com</a>
  </footer>
</body>
</html>
